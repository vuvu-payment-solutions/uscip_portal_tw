{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Link — USCIP Office Portal</title>
    {% tailwind_css %}
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        .font-display { font-family: 'Playfair Display', Georgia, serif; }
        .gold-accent {
            background: linear-gradient(90deg, #a88a2e, #c9a84c, #e8d48b, #c9a84c, #a88a2e);
            background-size: 200% 100%;
            animation: shimmer 4s ease infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-page {
            min-height: 100vh;
            color: #eaf2ff;
            background:
                radial-gradient(760px 320px at 82% -12%, rgba(59,130,246,.18), transparent 62%),
                radial-gradient(560px 280px at 4% 0%, rgba(53,213,234,.10), transparent 58%),
                linear-gradient(180deg, #0b1628, #07101f);
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .40;
            background-image:
                linear-gradient(rgba(130,160,210,.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(130,160,210,.06) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(900px 520px at 50% 0%, #000 30%, transparent 82%);
        }

        .auth-page > * { position: relative; z-index: 1; }

        .auth-card {
            border: 1px solid #223550;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(18,31,52,.94), rgba(15,26,45,.96));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.045),
                0 24px 50px -30px rgba(0,0,0,.90);
            overflow: hidden;
        }

        .auth-input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border-radius: 11px;
            border: 1px solid #315073;
            color: #eaf2ff;
            background: rgba(7,16,31,.74);
            outline: none;
            font-size: 13px;
            transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
        }

        .auth-input::placeholder { color: #6f819d; }
        .auth-input:focus {
            border-color: #35d5ea;
            box-shadow: 0 0 0 3px rgba(53,213,234,.16);
            background: rgba(7,16,31,.92);
        }

        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            border-radius: 11px;
            color: #04101f;
            background: linear-gradient(180deg, #5aa2ff, #3b82f6);
            box-shadow: 0 14px 26px -14px rgba(59,130,246,.85), inset 0 1px 0 rgba(255,255,255,.35);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
            transition: transform .14s ease, filter .14s ease;
        }

        .auth-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }

        .auth-link {
            color: #35d5ea;
            font-weight: 700;
            transition: color .14s ease;
        }

        .auth-link:hover { color: #c9a84c; }

        .auth-message {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
        }

        .auth-message.success {
            color: #bbf7d0;
            background: rgba(52,211,153,.12);
            border: 1px solid rgba(52,211,153,.35);
        }

        .auth-message.error {
            color: #fecdd3;
            background: rgba(251,113,133,.12);
            border: 1px solid rgba(251,113,133,.35);
        }

        .auth-message.info {
            color: #bfdbfe;
            background: rgba(59,130,246,.12);
            border: 1px solid rgba(59,130,246,.35);
        }
    </style>

</head>
<body class="auth-page flex flex-col">

    <header class="w-full flex items-center gap-3 px-6 py-4 bg-[#07101f]/85 border-b border-[#223550] backdrop-blur relative z-10">
        <img src="{% static 'images/quilter_logo.png' %}" alt="Quilter" class="w-11 h-11 object-contain bg-white rounded-md p-1" onerror="this.style.display='none'">
        <div>
            <div class="font-display font-bold text-lg text-white leading-tight">Office Portal</div>
            <div class="text-[10.5px] font-semibold text-[#c9a84c] tracking-[2.5px] uppercase">Quilter International</div>
        </div>
    </header>
    <div class="gold-accent h-[3px]"></div>

    <main class="flex-1 flex items-center justify-center px-5 py-10">
        <div class="w-full max-w-[430px] text-center">

            <div class="auth-card px-8 py-9">
                <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-[#fb7185]/12 border border-[#fb7185]/35 flex items-center justify-center">
                    <svg class="w-8 h-8 text-[#fecdd3]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                    </svg>
                </div>

                <div class="inline-flex items-center gap-2 text-[#35d5ea] font-mono text-[11px] font-black tracking-[.18em] uppercase mb-2">
                    <span class="w-2 h-2 rounded-full bg-[#35d5ea] shadow-[0_0_14px_rgba(53,213,234,.9)]"></span>
                    Account Recovery
                </div>

                <h1 class="font-display font-bold text-3xl text-white mb-2">Invalid or Expired Link</h1>
                <p class="text-sm text-[#9fb0ca] mb-8">
                    This password reset link is no longer valid.<br>
                    It may have expired or already been used.
                </p>

                <a href="{% url 'portal_forgot' %}" class="auth-btn px-8">
                    Request New Reset Link
                </a>

                <div class="mt-5">
                    <a href="{% url 'portal_home' %}" class="auth-link text-sm">← Back to Login</a>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
