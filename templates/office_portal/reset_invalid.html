{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Link — USCIP Office Portal</title>
    {% tailwind_css %}
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        .gold-accent { background: linear-gradient(90deg, #a88a2e, #c9a84c, #e8d48b, #c9a84c, #a88a2e); background-size: 200% 100%; animation: shimmer 4s ease infinite; }
        @keyframes shimmer { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .font-display { font-family: 'Playfair Display', Georgia, serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">

    <!-- Top Header -->
    <header class="w-full flex items-center gap-3 px-6 py-4 bg-white border-b border-gray-100 shadow-sm relative z-10">
        <img src="{% static 'images/quilter_logo.png' %}" alt="Quilter" class="w-11 h-11 object-contain" onerror="this.style.display='none'">
        <div>
            <div class="font-display font-bold text-lg text-[#0c1a2e] leading-tight">Office Portal</div>
            <div class="text-[10.5px] font-semibold text-[#a88a2e] tracking-[2.5px] uppercase">Quilter International</div>
        </div>
    </header>
    <div class="gold-accent h-[3px]"></div>

    <!-- Main -->
    <main class="flex-1 flex items-center justify-center px-5 py-10">
        <div class="w-full max-w-[420px] text-center">

            <!-- Error Icon -->
            <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-red-50 flex items-center justify-center">
                <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                </svg>
            </div>

            <h1 class="font-display font-bold text-2xl text-[#0c1a2e] mb-2">Invalid or Expired Link</h1>
            <p class="text-sm text-gray-400 mb-8">This password reset link is no longer valid.<br>It may have expired or already been used.</p>

            <a href="{% url 'portal_forgot' %}"
               class="inline-block px-8 py-3 bg-gradient-to-r from-[#1a2d4a] to-[#2a4270] text-white font-semibold rounded-xl hover:shadow-lg hover:shadow-[#1a2d4a]/20 transition-all text-sm">
                Request New Reset Link
            </a>

            <div class="mt-5">
                <a href="{% url 'portal_home' %}" class="text-sm text-[#2a4270] hover:text-[#c9a84c] font-medium transition-colors">
                    ← Back to Login
                </a>
            </div>

        </div>
    </main>

</body>
</html>
