        }

        /* Body與背景 */
        body::before {
            content: "";
            position: fixed;
            /* 1. 讓它待在正中央 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            
            /* 2. 重點：設定固定寬度與高度，不再滿版 */
            width: 50vw;           /* <--- 這裡改為 300px，圖片就縮小了 */
            height: 50vh;          /* 跟著寬度一起設定 */
            
            background-image: var(--logo-base64);
            
            /* 3. 背景設定：不要 cover，改用 contain 確保圖片完整顯示在框框內 */
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            
            /* 4. 維持淡化與置底 */
            opacity: 0.1; 
            filter: none !important; /* 保持彩色 */
            -webkit-filter: grayscale(0) !important;
            z-index: 3;
            pointer-events: none;
        }

        /* 前景層 */
        body > * {
            position: relative;
            z-index: 1;
        }

        #top-layer-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;           /* 設為 0，確保它在底層 */

            width: auto;
            height: auto;

            .ant-layout,

                <label>欲申請的帳號 (Username):</label>
                <input type="text" id="reg-username" class="ant-input" placeholder="例如: brian_wu">
            </div>
            <div class="ant-form-item">
                <label>真實姓名 (Full Name):</label>
                <input type="text" id="reg-fullname" class="ant-input" placeholder="請輸入您的真實姓名">
            </div>
            <div class="ant-form-item">
                <label>電子郵件 (Email):</label>
                <input type="email" id="reg-email" class="ant-input" placeholder="審核通過後，預設密碼會寄到這">
            </div>

                <label>所屬部門 (Department):</label>
                <input type="text" id="reg-dept" class="ant-input" placeholder="請輸入部門">
            </div>

        </div>

        <div id="list" class="section" style="display:none">
            <div class="main-container">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px">
                    <h2>Account Access Requests</h2>
                    <button class="ant-btn ant-btn-danger" onclick="logout()">Logout</button>
                </div>
                <div id="table-container">Fetch...</div>
            </div>
        </div>
    </div>
    <div id="root"></div>
    <script>
        // 取得當前登入者資訊
        let currentUser = JSON.parse(localStorage.getItem("user_info")) || null;

        // 頁面載入時初始化
        window.onload = function() {
            if (!currentUser) {
                showSection('login-section');
            } else {
                showDashboard();
            }
        };

        // 登入功能
        async function login() {
            const userField = document.getElementById("username").value;
            const passField = document.getElementById("password").value;

            try {
                const res = await fetch('http://localhost:8000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userField, password: passField })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("user_info", JSON.stringify(data));
                    currentUser = data;

                    // 檢查是否需要強制改密碼
                    if (data.need_password_change) {
                        alert("Hello, this is the first time you log in, please change your initial password!");
                        showSection('change-password-section'); // 顯示修改密碼畫面
                    } else {
                        showDashboard();
                    }
                } else {
                    alert("Incorrect Account or Password!");
                }
            } catch (err) {
                console.error(err);
                alert("Server Connecting Failed!");
            }
        }

        function doRegister() {
            // 1. 先從 HTML 抓取數值 (注意 ID 要跟 showSection 裡的一致)
            // 如果您在 showSection 用的是 reg-username，這裡就用 reg-username
            const username = document.getElementById('reg-u')?.value;
            const fullname = document.getElementById('reg-n')?.value;
            const email = document.getElementById('reg-e')?.value;
            const dept = document.getElementById('reg-d')?.value;

            // 2. 前端基礎驗證 (SSDLC: 減少無效請求)
            if (!username || !fullname || !email) {
                alert("請填寫完整資訊！ (帳號、姓名與 Email 為必填)");
                return;
            }

            // 3. 準備 JSON 資料
            const payload = {
                username: username,
                full_name: fullname,
                email: email,
                department: dept || "N/A",
                requested_role: document.getElementById('reg-role').value
            };

            // 4. 發送請求到後端
            fetch('http://127.0.0.1:8000/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json' // 🚩 告訴後端我們要傳 JSON
                },
                body: JSON.stringify(payload) // 🚩 將物件轉為字串
            })
            .then(async res => {
                const data = await res.json();
                if (res.ok) {
                    // 成功：顯示後端回傳的 message
                    alert(data.message);
                    showSection('form_login'); 
                } else {
                    // 失敗：顯示後端 Pydantic 驗證失敗的詳細原因
                    // 如果是 Pydantic 報錯，原因通常在 data.detail 裡
                    const errorMsg = Array.isArray(data.detail) ? data.detail[0].msg : data.detail;
                    alert("註冊失敗：" + errorMsg);
                }
            })
            .catch(err => {
                console.error("Fetch error:", err);
                alert("註冊連線失敗，請檢查 API 服務是否啟動");
            });
        }

        async function doApprove(id, role, path) {
            // 🚩 path 接收到的會是 'approve-account' 或 'approve-service'
            // 為了安全與準確，我們直接構造 URL
            const apiUrl = `http://localhost:8000/${path}/${id}`;

            // 使用 FormData 傳送 role
            const formData = new FormData();
            formData.append('role', role);
            
            // 如果是帳號審核，後端邏輯通常需要一個 status='Approved'
            if (path === 'approve-account') {
                formData.append('status', 'Approved');
            }

            try {
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData // 後端用 Form(...) 接收
                });

                if (res.ok) {
                    const label = (path === 'approve-account') ? '帳號申請' : '服務申請';
                    alert(`[${label}] 審核成功！`);
                    loadList(); // 重新整理清單
                } else {
                    const errorData = await res.json();
                    alert("審核失敗: " + (errorData.detail || "未知錯誤"));
                }
            } catch (err) {
                console.error("Approve error:", err);
                alert("網路連線異常，請檢查後端服務");
            }
        }

        // 駁回功能
        async function doReject(id, role) {
            if (!confirm("Are you sure you want to reject this application?")) {
                return;
            }
            
            console.log(`Rejection is being processed... Ref No. ID: ${id}, Role: ${role}`);
            
            try {
                const res = await fetch(`http://localhost:8000/reject/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: role })
                });

                if (res.ok) {
                    alert("Application rejected.");
                    loadList(currentUser.role); 
                } else {
                    const errorData = await res.json();
                    alert("Rejection failed: " + (errorData.detail || "unknown error"));
                }
            } catch (err) {
                console.error("Network request error:", err);
                alert("Unable to connect to the server");
            }
        }

        // 修改密碼功能
        async function changePassword() {
            const newPassword = document.getElementById("new_password").value;
            if (newPassword.length < 8) {
                alert("密碼長度至少需要 8 位！");
                return;
            }

            const res = await fetch('http://localhost:8000/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: currentUser.username, 
                    new_password: newPassword 
                })
            });

            if (res.ok) {
                alert("密碼修改成功，請重新登入！");
                logout();
            }
        }

        // 顯示儀表板並自動填寫資訊
        function showDashboard() {
            showSection('main-dashboard');
            document.getElementById("display-name").innerText = currentUser.username;
            
            // 自動填入申請單中的Applicant姓名 (不可修改)
            if (document.getElementById("apply_a_name")) {
                document.getElementById("apply_a_name").value = currentUser.username;
                document.getElementById("apply_a_name").readOnly = true;
            }

            // 根據權限顯示清單或審核按鈕
            loadList();
        }

        // 提交申請單
        async function submitApply() {
            // 1. 建立 FormData 物件 (這是傳檔案的標配)
            const formData = new FormData();
            
            // 2. 逐一加入欄位 (對應 main.py 的 Form 參數)
            formData.append("f_no", document.getElementById("f_no").value);
            formData.append("a_name", currentUser.username); // 從登入資訊抓
            formData.append("department", document.getElementById("department").value);
            formData.append("a_purpose", document.getElementById("a_purpose").value);
            formData.append("a_type", document.getElementById("a_type").value);
            
            // 3. 處理檔案
            const fileField = document.getElementById("a_file");
            if (fileField.files[0]) {
                formData.append("file", fileField.files[0]);
            }

            // 4. 送往後端
            try {
                const response = await fetch("/apply", {
                    method: "POST",
                    // 💡 記住：不要手動加 Content-Type header，瀏覽器會自動設為 multipart/form-data
                    body: formData
                });
                
                if (response.ok) {
                    alert("申請已成功提交！");
                    location.reload(); 
                } else {
                    alert("提交失敗，請檢查輸入內容。");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        // 審核功能 (限主管與 CIO)
        async function approveForm(id) {
            if (currentUser.role === 'user') {
                alert("You do not have approve permissions");
                return;
            }

            const res = await fetch(`http://localhost:8000/approve/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    role: currentUser.role, 
                    name: currentUser.username 
                })
            });

            if (res.ok) {
                alert("Approve successful！");
                loadList();
            }
        }

        async function doApply() {
            // 🚩 1. 處理多選系統 (保持您的優良邏輯)
            const sysEl = document.getElementById('service_system');
            if (!sysEl) {
                console.error("找不到 service_system 元素！");
                return;
            }
            const selectedValues = Array.from(sysEl.selectedOptions).map(opt => opt.value).join(", ");

            // 🚩 2. 改用 FormData 以支援檔案上傳 (SSDLC 必備)
            const fd = new FormData();
            
            // 將欄位一一加入 (注意後端變數名稱)
            fd.append('a_name', document.getElementById('a_name').value);
            fd.append('a_type', document.getElementById('a_type').value);
            fd.append('a_purpose', document.getElementById('a_purpose').value);
            fd.append('department', document.getElementById('department').value);
            fd.append('service_system', selectedValues);
            
            // 🚩 3. 抓取檔案 (假設 ID 是 api-file)
            const fileInput = document.getElementById('a_file'); 
            if (fileInput && fileInput.files[0]) {
                fd.append('file', fileInput.files[0]);
            }

            // 🚩 4. 基礎檢查
            if (!document.getElementById('a_name').value || !selectedValues) {
                alert("Please fill in required fields!");
                return;
            }

            console.log("SSDLC Audit: Sending FormData to /apply...");

            try {
                // 🚩 5. 發送請求 (注意：傳送 FormData 時，不要手動設定 Content-Type 標頭)
                const res = await fetch('http://localhost:8000/apply', {
                    method: 'POST',
                    body: fd // 直接傳 FormData
                });

                const result = await res.json();

                if (res.ok) {
                    alert("Application Successful! Ref No.: " + (result.f_no || "N/A"));
                    showSection('list');
                    if (typeof loadList === 'function') {
                        loadList();
                    }
                } else {
                    alert("Application Fail: " + (result.detail || "Server Error"));
                }
            } catch (err) {
                console.error("Apply Error:", err);
                alert("Unable to connect to the backend server.");
            }
        }

        function logout() {
        // 🚩 SSDLC: 登出必須徹底清除狀態
            localStorage.removeItem("user_info");
            currentUser = null;
            alert("You have been logged out safely.");
            showSection('login');
            // 強制重新整理頁面，確保記憶體內的資料也被清空
            location.reload();
        }
        
        async function doLogin() {
            // 1) 對齊你的 HTML ID
            const userElement = document.getElementById('u');
            const passElement = document.getElementById('p');

            if (!userElement || !passElement) {
                alert("系統錯誤：找不到登入輸入框 (ID: u/p)");
                return;
            }

            const usernameValue = userElement.value.trim();
            const passwordValue = passElement.value;

            if (!usernameValue || !passwordValue) {
                alert("請輸入帳號與密碼");
                return;
            }

            // 2) 取得 Django CSRF Token（需同網域 cookie）
            const csrfToken = (document.cookie.split('; ')
                .find(row => row.startsWith('csrftoken=')) || '')
                .split('=')[1];

            if (!csrfToken) {
                alert("CSRF Token 不存在：請確認此頁面是由 Django render，且已啟用 CSRF cookie。");
                return;
            }

            try {
                // 3) 發送請求到 Django
                const res = await fetch('/office-portal/login/', {
                    method: 'POST',
                    credentials: 'same-origin', // ✅ 讓 Django session cookie 生效
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        username: usernameValue,
                        password: passwordValue
                    })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok && data.success) {
                    // ✅ Django 已建立 session，直接導到 dashboard
                    window.location.href = "/office-portal/dashboard/";
                    return;
                }

                // ❌ 登入失敗
                alert(data.detail || "帳號密碼錯誤");
            } catch (networkErr) {
                console.error("連線失敗:", networkErr);
                alert("無法連線至伺服器，請檢查後端是否啟動");
            }
        }

        async function updatePassword() {
            const newP = document.getElementById('new_p').value;
            const confirmP = document.getElementById('confirm_p').value;

            // 1. 基本檢查
            if (newP.length < 8) {
                alert("Password must be at least 8 characters long!");
                return;
            }
            if (newP !== confirmP) {
                alert("Passwords do not match!");
                return;
            }

            try {
                const res = await fetch('http://localhost:8000/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username, // 從剛剛登入存好的 currentUser 抓取
                        new_password: newP
                    })
                });

                const result = await res.json();

                if (res.ok) {
                    alert("Password updated successfully! Please login with your new password.");
                    logout(); // 強制登出，讓使用者重新跑一次正常的登入流程
                } else {
                    alert("Update failed: " + (result.detail || "Unknown error"));
                }
            } catch (err) {
                console.error("Update password error:", err);
                alert("Server connection failed.");
            }
        }

                    <div class="login-card" style="max-width:500px">
                        <h2 style="text-align:center">User Registration</h2>
                        <div style="margin-bottom:10px">
                            <label>Account Name (Username):</label>
                            <input id="reg-u" class="ant-input" placeholder="e.g. jdoe">
                        </div>
                        <div style="margin-bottom:10px">
                            <label>Full Name:</label>
                            <input id="reg-n" class="ant-input" placeholder="e.g. John Doe">
                        </div>
                        <div style="margin-bottom:10px">
                            <label>Email:</label>
                            <input id="reg-e" class="ant-input" type="email" placeholder="john.doe@quilter.net">
                        </div>
                        <div style="margin-bottom:15px">
                            <label>Department:</label>
                            <select id="reg-d" class="ant-input">
                                <option value="IT">IT</option>
                                <option value="HR">HR</option>
                                <option value="CS">CS</option>
                            </select>
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label>申請職位 (Role):</label>
                            <select id="reg-role" class="ant-input">
                                <option value="user">一般使用者 (User)</option>
                                <option value="supervisor">主管 (Supervisor)</option>
                                <option value="cio">資訊長 (CIO)</option>
                            </select>
                        </div>                        
                        <button class="ant-btn ant-btn-primary ant-btn-block" onclick="doRegister()">Submit Registration</button>
                        <div style="text-align:center; margin-top:10px">
                            <a href="javascript:void(0)" onclick="showSection('login')">Already have an account? Login</a>
                        </div>
                    </div>
                `;
            }
            else if (id === 'list') {
                document.getElementById('form_list').style.display = 'block';
            } 
            // ✅ 補上這兩行，對齊您按鈕傳進來的 'register' 字串
            else if (id === 'register') {
                document.getElementById('form_register').style.display = 'block';
            }
        }

        function renderActionButtons(item) {
            // 取得當前使用者的角色，如果沒登入就給空字串
            const role = currentUser ? currentUser.role : '';
            const status = item.status;

            // 1. 如果單子已經結案（核准或駁回），就不給按鈕，只給文字標籤
            if (status === 'Approved' || status === 'Rejected') {
                return `<span class="ant-tag">${status}</span>`;
            }

            // 定義通用的按鈕 HTML 模板
            // 這裡我們把後端 API 路徑判定好：如果是 account 就走帳號審核，否則走服務審核
            const apiPath = (item.dataType === 'account') ? 'approve-account' : 'approve-service';
            const buttons = (currentRole) => `
                <button class="ant-btn ant-btn-primary ant-btn-sm" 
                        onclick="doApprove(${item.id}, '${currentRole}', '${apiPath}')">Approve</button>
                <button class="ant-btn ant-btn-danger ant-btn-sm" 
                        onclick="doReject(${item.id}, '${currentRole}', '${apiPath}')">Reject</button>
            `;

            // 2. CIO 可以審核任何待審單
            if (role === 'cio' && (status === 'Pending CIO' || status === 'Pending Supervisor')) {
                return buttons('cio');
            }

            // 3. Supervisor 只能審核 Pending Supervisor
            if (role === 'supervisor' && status === 'Pending Supervisor') {
                return buttons('supervisor');
            }

            // 4. 其他情況（例如一般 User 或是條件不符），只顯示目前狀態文字
            return `<span style="color: #888">${status}</span>`;
        }

        async function loadList() {
            const tbody = document.getElementById('appTableBody');
            const pendingBadge = document.getElementById('pendingBadge');

            // 如果連容器都找不到，直接中斷防止後續崩潰
            if (!tbody) return;

            try {
                // 1. 同時抓取兩份資料，並在網路層級加強防禦（catch 掉斷線）
                const [resApp, resAcc] = await Promise.all([
                    fetch('http://localhost:8000/applications').catch(() => null),
                    fetch('http://localhost:8000/account-requests').catch(() => null)
                ]);

                // 2. 🛡️ 【JSON 解析與空值判定】
                // 只要不是 200 OK 或者 JSON 解析失敗，通通回傳 []
                const getJson = async (res) => {
                    if (res && res.ok) {
                        try {
                            const data = await res.json();
                            return Array.isArray(data) ? data : [];
                        } catch (e) { return []; }
                    }
                    return [];
                };

                const rawApp = await getJson(resApp);
                const rawAcc = await getJson(resAcc);

                // 3. 🛡️ 【內容清洗】過濾掉 null、非物件、空物件
                const filterValid = (list) => list.filter(item => 
                    item !== null && 
                    typeof item === 'object' && 
                    Object.keys(item).length > 0
                );

                const safeApp = filterValid(rawApp);
                const safeAcc = filterValid(rawAcc);

                // 4. 🛡️ 【欄位對齊與型別強轉】對齊帳號申請表 (AccountRequest)
                const normalizedAcc = safeAcc.map(item => {
                    const id = (item.id !== undefined && item.id !== null) ? item.id : 0;
                    return {
                        id: id,
                        f_no: `ACC-${String(id).padStart(4, '0')}`,
                        a_name: String(item.full_name || 'N/A'),
                        department: String(item.department || 'N/A'),
                        service_system: '帳號申請',
                        a_type: 'Account',
                        a_purpose: String(item.email || 'N/A'),
                        file_path: item.file_path || null,
                        status: String(item.status || 'Pending'),
                        approval_status: item.status === 'Approved' ? 'Success' : 'Pending',
                        dataType: 'account'
                    };
                });

                // 5. 🛡️ 【欄位對齊】對齊服務申請表 (Application)
                const normalizedApp = safeApp.map(item => ({
                    id: item.id || 0,
                    f_no: String(item.f_no || 'N/A'),
                    a_name: String(item.a_name || 'N/A'),
                    department: String(item.department || 'N/A'),
                    service_system: String(item.service_system || 'N/A'),
                    a_type: String(item.a_type || 'N/A'),
                    a_purpose: String(item.a_purpose || 'N/A'),
                    file_path: item.file_path || null,
                    status: String(item.status || 'Pending'),
                    approval_status: String(item.approval_status || 'Pending'),
                    dataType: 'service'
                }));

                // 6. 🛡️ 【合併與排序】保證兩者皆為 Array 才進行展開
                const data = [...normalizedAcc, ...normalizedApp];
                data.sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0));

                // 7. 🚩 【更新 Badge】處理待辦數量
                if (pendingBadge) {
                    const pendingCount = data.filter(i => i.status === 'Pending').length;
                    pendingBadge.textContent = pendingCount > 0 ? pendingCount : '';
                    pendingBadge.style.display = pendingCount > 0 ? 'inline-block' : 'none';
                }

                // 8. 🛡️ 【渲染 HTML】
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center">目前查無效紀錄</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td style="font-weight:bold; color:#1890ff">${item.f_no}</td>
                        <td>${item.a_name}</td>
                        <td>${item.department}</td>
                        <td>${item.service_system}</td>
                        <td>${item.a_type}</td>
                        <td style="font-size:12px">${item.a_purpose}</td>
                        <td>${item.file_path ? `<a href="http://localhost:8000/${item.file_path}" target="_blank">📎</a>` : '無'}</td>
                        <td><span class="ant-tag ant-tag-blue">${item.status}</span></td>
                        <td><span class="ant-tag ant-tag-green">${item.approval_status}</span></td>
                        ${(currentUser && currentUser.role !== 'user') 
                            ? `<td>${renderActionButtons(item)}</td>` : ''}
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Critical Load Error:", err);
                if (tbody) tbody.innerHTML = `<tr><td colspan="10" style="color:red; text-align:center">資料載入時發生嚴重錯誤，請聯繫技術人員</td></tr>`;
            }
        }

        // ✅ 篩選待審核項目
        async function filterPending() {
            try {
                const res = await fetch('http://localhost:8000/applications');
                const data = await res.json();
                const tbody = document.getElementById('appTableBody');
                const isAdmin = (currentUser.role === 'supervisor' || currentUser.role === 'cio');
                
                // 根據角色篩選
                let filteredData = [];
                if (currentUser.role === 'supervisor') {
                    filteredData = data.filter(item => item.status === 'Pending Supervisor');
                } else if (currentUser.role === 'cio') {
                    filteredData = data.filter(item => item.status === 'Pending CIO');
                }
                
                filteredData.sort((a, b) => b.id - a.id);

                if (filteredData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${isAdmin ? 8 : 7}" style="text-align:center">無待審核項目</td></tr>`;
                    return;
                }

                tbody.innerHTML = filteredData.map(item => `
                    <tr style="background-color: #fff7e6;">
                        <td style="font-weight:bold; color:var(--primary-blue)">${item.f_no}</td>
                        <td>${item.a_name}</td>
                        <td>${item.department}</td>
                        <td>${item.service_system}</td>
                        <td>${item.a_type}</td>
                        <td style="word-break: break-all; white-space: normal; text-align: left; font-size: 12px; max-width: 200px;">${item.a_purpose}</td>
                        <td><span class="ant-tag ant-tag-blue">${item.status}</span></td>
                        <td><span class="ant-tag ant-tag-green">${item.approval_status}</span></td>
                        ${isAdmin ? `<td>${renderActionButtons(item, currentUser.role)}</td>` : ''}
                    </tr>
                `).join('');
                
                // 更新徽章顯示「顯示全部」按鈕
                const pendingBadge = document.getElementById('pendingBadge');
                if (pendingBadge) {
                    pendingBadge.innerHTML = `
                        <span style="background:#1890ff; color:white; padding:4px 12px; border-radius:12px; font-size:13px; cursor:pointer;" 
                              onclick="loadList(currentUser.role)">
                            📋 顯示全部
                        </span>`;
                }

            } catch (err) {
                console.error("Filter error:", err);
            }
        }

        function getBtn(role, item) {
            // 1. If form is closed
            if (item.status === 'Approved') {
                return `<span style="color: #52c41a; font-weight: bold;">✓ Closed</span>`;
            }

            // 2. Supervisor Actions
            if (role === 'supervisor' && item.status === 'Pending Supervisor') {
                return `<button class="ant-btn ant-btn-primary" onclick="doApprove(${item.id}, 'supervisor')">Approve</button>`;
            }

            // 3. CIO Actions
            if (role === 'cio' && item.status === 'Pending CIO') {
                return `<button class="ant-btn ant-btn-primary" style="background:#52c41a; border-color:#52c41a" onclick="doApprove(${item.id}, 'cio')">Finalize</button>`;
            }

            // 4. Default
            return `<span style="color:#bfbfbf">In Progress</span>`;
        }

        function getCSRFToken() {
            return document.cookie.split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
        }

        window.onload = function() {
            const storeUser = localStorage.getItem("user_info");
            // 🚩 監視點 D
            console.log("【Window Reload】抓取快取結果:", storeUser);

            console.log("Page loaded. Executing startup logic...");
            if (storeUser) {
                currentUser = JSON.parse(storeUser);
                console.log("偵測到登入狀態:", currentUser.username);
                if (currentUser.role === 'user') {
                    showSection('apply');
                } else {
                    showSection('list');
                    loadList(); // 只有進入 list 頁面時才需要載入列表
                }                
            } else {
                showSection('login'); // 沒登入過，強制看登入畫面
            }
        };
        // ==========================================        
    </script>
</body>
