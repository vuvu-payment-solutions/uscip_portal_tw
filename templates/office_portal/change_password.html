<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>修改密碼 - USCIP</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
    h2 { margin-bottom: 24px; }
    label { display: block; margin-bottom: 4px; font-size: 14px; color: #333; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 14px; box-sizing: border-box; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #1a73e8; }
    .btn { width: 100%; padding: 12px; background: #1a73e8; color: #fff;
           border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    .btn:hover { background: #1558b0; }
    .msg-success { color: #1e8a3c; margin-bottom: 16px; font-size: 14px; }
    .msg-error   { color: #c0392b; margin-bottom: 16px; font-size: 14px; }
    .back { display: block; text-align: center; margin-top: 16px;
            font-size: 13px; color: #1a73e8; text-decoration: none; }
    .rules { font-size: 12px; color: #888; margin-top: -12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h2>🔑 修改密碼</h2>

  {% if messages %}
    {% for m in messages %}
      <div class="{% if 'success' in m.tags %}msg-success{% else %}msg-error{% endif %}">
        {{ m }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <label>目前密碼 *</label>
    <input type="password" name="old_password" required autocomplete="current-password">

    <label>新密碼 *</label>
    <input type="password" name="new_password1" required autocomplete="new-password">
    <p class="rules">至少 8 個字元，不能與帳號名稱相同</p>

    <label>確認新密碼 *</label>
    <input type="password" name="new_password2" required autocomplete="new-password">

    <button class="btn" type="submit">確認修改</button>
  </form>

  <a class="back" href="/office-portal/dashboard/">← 回到 Dashboard</a>
</body>
</html>
