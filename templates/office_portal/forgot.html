<!doctype html>
<html>
  <body>
    <h2>Forgot password</h2>

    {% if messages %}
      <ul>
        {% for m in messages %}<li>{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input name="email" placeholder="Email" />
      <button type="submit">Send reset link</button>
    </form>

    <p><a href="/office-portal/">Back to login</a></p>
  </body>
</html>
